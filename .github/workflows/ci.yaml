name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.result.outputs.should_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Throttle push CI to ~every 5th push
        id: throttle
        if: github.event_name == 'push'
        env:
          WORKFLOW_FILE: ci.yaml
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          last_sha=""
          run_ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${BRANCH}&status=success&per_page=5" --jq -r '.workflow_runs[].id' 2>/dev/null || true)
          if [ -n "${run_ids}" ] && [ "${run_ids}" != "null" ]; then
            for id in ${run_ids}; do
              executed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq -r '[.jobs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo "0")
              if [ "${executed}" -gt 0 ]; then
                last_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq -r '.head_sha' 2>/dev/null || true)
                break
              fi
            done
          fi
          if [ -z "${last_sha}" ]; then
            echo "Gate: no previous full push run found; running CI."
            echo "SHOULD_RUN=true" >> "${GITHUB_ENV}"
            exit 0
          fi
          count=$(git rev-list --count "${last_sha}..HEAD" 2>/dev/null || echo "999")
          echo "Gate: commits since last full push run on ${BRANCH}: ${count}"
          if [ "${count}" -ge 5 ]; then
            echo "SHOULD_RUN=true" >> "${GITHUB_ENV}"
          else
            echo "SHOULD_RUN=false" >> "${GITHUB_ENV}"
          fi

      - name: Resolve gate output
        id: result
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "should_run=${SHOULD_RUN:-false}" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev,server --extras storage --no-interaction

      - name: Unit + API + regression tests
        run: poetry run pytest tests/ -v --cov=src/prismpipe --cov-report=xml

      - name: Benchmark gate
        run: |
          chmod +x scripts/bench/run_bench_gate.sh
          ./scripts/bench/run_bench_gate.sh

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build package
        run: poetry build

      - name: Check package
        run: |
          pip install twine
          python -m twine check dist/*