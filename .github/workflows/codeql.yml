name: CodeQL

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.result.outputs.should_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Throttle push CodeQL to ~every 5th push
        id: throttle
        if: github.event_name == 'push'
        env:
          WORKFLOW_FILE: codeql.yml
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          last_sha=""
          run_ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${BRANCH}&status=success&per_page=5" --jq -r '.workflow_runs[].id' 2>/dev/null || true)
          if [ -n "${run_ids}" ] && [ "${run_ids}" != "null" ]; then
            for id in ${run_ids}; do
              executed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq -r '[.jobs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo "0")
              if [ "${executed}" -gt 0 ]; then
                last_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq -r '.head_sha' 2>/dev/null || true)
                break
              fi
            done
          fi
          if [ -z "${last_sha}" ]; then
            echo "Gate: no previous full push run found; running CodeQL."
            echo "SHOULD_RUN=true" >> "${GITHUB_ENV}"
            exit 0
          fi
          count=$(git rev-list --count "${last_sha}..HEAD" 2>/dev/null || echo "999")
          echo "Gate: commits since last full push run on ${BRANCH}: ${count}"
          if [ "${count}" -ge 5 ]; then
            echo "SHOULD_RUN=true" >> "${GITHUB_ENV}"
          else
            echo "SHOULD_RUN=false" >> "${GITHUB_ENV}"
          fi

      - name: Resolve gate output
        id: result
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "should_run=${SHOULD_RUN:-false}" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          fi

  analyze:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    timeout-minutes: 20
    name: Analyze (python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1